<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Reporte — Fundación Hogar de Cristo</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .report-card { margin-top: 16px; }
    .kpi-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .kpi-row:last-child { border-bottom: none; }
    .kpi-label { font-weight: 600; }
    .kpi-val { text-align: right; }
    .kpi-pct { font-weight: 700; color: var(--accent); }
    .comision-box {
      margin-top: 16px; padding: 16px; background: var(--surface2);
      border-radius: 8px; text-align: center;
    }
    .comision-amount { font-size: 1.6rem; font-weight: 700; color: var(--green); margin: 4px 0; }
    .summary-box { padding: 10px; background: var(--surface2); border-radius: 6px; margin-top: 12px; font-size: 0.85rem; }
    .proy-box { padding: 10px; background: #1e293b; border-radius: 6px; margin-top: 10px; font-size: 0.85rem; }
    .back-link { display: inline-block; margin-top: 16px; font-size: 0.82rem; color: var(--accent); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>Mi Reporte Comercial</h1>
  <p>Consulta tu avance y comision del mes</p>
</header>

<div class="container" style="max-width:600px">

  <div class="card" style="margin-top:20px">
    <h2 style="font-size:1rem;margin-bottom:12px">Ingresa tu RUT</h2>
    <div style="display:flex;gap:8px">
      <input type="text" id="inp-rut" placeholder="12345678K"
        style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1rem"
        onkeydown="if(event.key==='Enter')buscarReporte()">
      <button class="btn" onclick="buscarReporte()">Consultar</button>
    </div>
    <p class="small" style="margin-top:8px">Sin puntos ni guion. Ej: 12345678K</p>
  </div>

  <div id="loading" style="display:none;text-align:center;padding:30px">
    <div style="font-size:1.5rem;animation:pulse 1s infinite">...</div>
    <p class="small">Buscando tu reporte</p>
  </div>

  <div id="resultado"></div>

  <a href="index.html" class="back-link">← Volver al panel de administracion</a>
</div>

<div id="toast" class="toast"></div>

<script src="js/supabase.js"></script>
<script>
function normRut(rut) {
  return String(rut).trim().toUpperCase().replace(/[^0-9K]/g, "");
}

function showToast(msg, type) {
  var toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "toast show " + (type || "success");
  setTimeout(function() { toast.className = "toast"; }, 3000);
}

function clp(monto) {
  return "$" + Math.round(monto).toLocaleString("es-CL");
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

var MESES = ["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
var BADGE_COLORS = { A: "#7c3aed", B: "#0891b2", C: "#d97706", S: "#dc2626" };

async function buscarReporte() {
  var rut = normRut(document.getElementById("inp-rut").value);
  if (!rut || rut.length < 7) { showToast("Ingresa un RUT valido", "error"); return; }

  document.getElementById("loading").style.display = "block";
  document.getElementById("resultado").innerHTML = "";

  try {
    var data = await SUPABASE.buscarPorRut(rut);
    document.getElementById("loading").style.display = "none";

    if (!data.length) {
      document.getElementById("resultado").innerHTML =
        '<div class="card report-card" style="text-align:center">' +
        '<p style="font-size:1.5rem;margin-bottom:8px">No encontrado</p>' +
        '<p>No hay reporte para RUT <strong>' + rut + '</strong></p>' +
        '<p class="small" style="margin-top:8px">Verifica que el RUT este correcto o contacta a tu supervisora.</p></div>';
      return;
    }

    var r = data[0];
    var d = r.datos || {};
    var partes = (r.periodo || "").split("-");
    var periodoLabel = partes[1] ? MESES[parseInt(partes[1])] + " " + partes[0] : r.periodo;
    var badgeLabel = r.grupo === "S" ? "SUP" : r.grupo;
    var updatedAt = r.updated_at ? new Date(r.updated_at).toLocaleString("es-CL") : "";

    var html = '<div class="card report-card">';
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">';
    html += '<span class="badge" style="background:' + (BADGE_COLORS[r.grupo] || "#666") + '">' + badgeLabel + '</span>';
    html += '<div><strong style="font-size:1.1rem">' + escapeHtml(r.nombre) + '</strong>';
    html += '<div class="small">' + escapeHtml(r.esquema || "") + ' &middot; ' + periodoLabel + '</div></div></div>';
    html += '<div class="small" style="margin-bottom:12px">Corte captacion: ' + (r.fecha_corte || "N/A");
    if (r.fecha_corte_ms) html += ' &middot; Mec. Superior al ' + r.fecha_corte_ms + ' <span style="color:#f59e0b">(puede tener retraso)</span>';
    html += '</div>';
    html += '<div class="small" style="margin-bottom:12px">Actualizado: ' + updatedAt + '</div>';

    if (r.grupo === "A") html += renderBloqueA(d);
    else if (r.grupo === "B") html += renderBloqueB(d);
    else if (r.grupo === "C") html += renderBloqueC(d);
    else if (r.grupo === "S") html += renderBloqueSuper(d);

    if (r.grupo !== "S" && d.comision != null) {
      html += '<div class="comision-box">';
      html += '<div class="small" style="text-transform:uppercase;letter-spacing:0.05em">Comision Proyectada</div>';
      html += '<div class="comision-amount">' + clp(d.comision) + '</div>';
      html += '<div class="small">Tramo: ' + (d.tramo || "—") + '</div></div>';
    }
    html += '</div>';

    if (r.mensaje) {
      html += '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:0.85rem;color:var(--accent)">Ver mensaje completo</summary>';
      html += '<pre class="msg-preview" style="margin-top:8px;max-height:none">' + escapeHtml(r.mensaje) + '</pre></details>';
    }

    document.getElementById("resultado").innerHTML = html;

  } catch (e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("resultado").innerHTML =
      '<div class="card report-card" style="text-align:center"><p style="color:var(--red)">Error al consultar: ' + escapeHtml(e.message) + '</p></div>';
  }
}

function kpiRow(label, real, meta, pct) {
  return '<div class="kpi-row"><span class="kpi-label">' + label + '</span>' +
    '<span class="kpi-val">' + real + ' de ' + meta + ' <span class="kpi-pct">(' + (pct || 0) + '%)</span></span></div>';
}

function renderProy(d) {
  var dt = d.diasTranscurridos || 0;
  var dtot = d.diasTotales || 0;
  if (!dt || !dtot) return '';
  return '<div class="proy-box"><div style="font-weight:600;margin-bottom:4px">Proyeccion al cierre</div>' +
    '<div class="small" style="margin-bottom:6px">Dia laboral ' + dt + ' de ' + dtot + '</div>';
}

function renderBloqueA(d) {
  var h = '<div style="font-weight:600;margin-bottom:8px">Llevas / Meta</div>';
  h += kpiRow("Q Acuerdos", d.realQ || 0, d.metaQ || 0, d.pctQ);
  h += kpiRow("Monto", clp(d.realMonto || 0), clp(d.metaMonto || 0), d.pctMonto);
  h += kpiRow("Mec. Superior", clp(d.realMs || 0), clp(d.metaMs || 0), d.pctMs);
  h += '<div class="summary-box">';
  h += '<div>Avance: <strong>' + (d.avanceRaw || 0) + '%</strong> &middot; Cumpl: <strong>' + (d.cumplimientoGlobal || 0) + '%</strong></div></div>';
  var p = renderProy(d);
  if (p) { h += p; h += '<div>Q Acuerdos: <strong>' + (d.proyQ || 0) + '</strong> &middot; Monto: <strong>' + clp(d.proyMonto || 0) + '</strong></div>'; h += '<div>Mec. Sup: <strong>' + clp(d.proyMs || 0) + '</strong></div></div>'; }
  return h;
}

function renderBloqueB(d) {
  var h = '<div style="font-weight:600;margin-bottom:8px">Llevas / Meta</div>';
  h += kpiRow("Captacion", clp(d.realCaptacion || 0), clp(d.metaCaptacion || 0), d.pctCaptacion);
  h += kpiRow("Mec. Superior", clp(d.realMs || 0), clp(d.metaMs || 0), d.pctMs);
  h += '<div class="summary-box">';
  h += '<div>Avance: <strong>' + (d.avanceRaw || 0) + '%</strong> &middot; Cumpl: <strong>' + (d.cumplimientoGlobal || 0) + '%</strong></div></div>';
  h += '<div style="margin-top:10px;font-size:0.85rem">';
  h += '<div>Tabla: ' + clp(d.variable1 || 0) + ' &middot; Reaj: ' + clp(d.variable2 || 0) + ' &middot; Don: ' + clp(d.variable3 || 0) + '</div></div>';
  var p = renderProy(d);
  if (p) { h += p; h += '<div>Captacion: <strong>' + clp(d.proyCaptacion || 0) + '</strong> &middot; Mec. Sup: <strong>' + clp(d.proyMs || 0) + '</strong></div></div>'; }
  return h;
}

function renderBloqueC(d) {
  var h = '<div style="font-size:1.1rem;margin-bottom:8px">Venta Total: <strong>' + clp(d.ventaTotal || 0) + '</strong></div>';
  h += '<div style="font-size:0.85rem">';
  h += '<div>General: ' + clp(d.montoGeneral || 0) + ' &rarr; ' + clp(d.comGeneral || 0) + '</div>';
  h += '<div>Preferente: ' + clp(d.montoPreferente || 0) + ' &rarr; ' + clp(d.comPreferente || 0) + '</div>';
  h += '<div>Gold: ' + clp(d.montoGold || 0) + ' &rarr; ' + clp(d.comGold || 0) + '</div></div>';
  var p = renderProy(d);
  if (p) { h += p; h += '<div>Venta: <strong>' + clp(d.proyVenta || 0) + '</strong> &middot; Mec. Sup: <strong>' + clp(d.proyMs || 0) + '</strong></div></div>'; }
  return h;
}

function renderBloqueSuper(d) {
  var a = d.acumulado || {};
  var dt = a.diasTranscurridos || 0;
  var dtot = a.diasTotales || 1;
  var h = '<div style="font-weight:600;margin-bottom:8px">Equipo (' + (a.n_ejecutivas || 0) + ' ejecutivas)</div>';
  h += '<div style="font-size:0.9rem;margin-bottom:12px">';
  h += '<div style="padding:6px 0;border-bottom:1px solid var(--border)">Captaciones: <strong>' + clp(a.total_captacion || 0) + '</strong></div>';
  h += '<div style="padding:6px 0">Mec. Superior: <strong>' + clp(a.total_ms || 0) + '</strong></div>';
  h += '</div>';
  h += '<div class="proy-box">';
  h += '<div style="font-weight:600;margin-bottom:6px">Proyeccion al cierre</div>';
  h += '<div class="small" style="margin-bottom:6px">Dia laboral ' + dt + ' de ' + dtot + '</div>';
  h += '<div>Captaciones: <strong>' + clp(a.proyCapt || 0) + '</strong></div>';
  h += '<div>Mec. Superior: <strong>' + clp(a.proyMs || 0) + '</strong></div>';
  h += '</div>';
  return h;
}

document.getElementById("inp-rut").focus();
</script>
</body>
</html>
