[[headers]]
for = "/*"

  [headers.values]
  Strict-Transport-Security = "max-age=31536000"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
  Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://chatnexialabpro.netlify.app; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me"